name: Run Job Agent

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: 

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy google-genai pyyaml playwright beautifulsoup4 requests
          playwright install chromium
          playwright install-deps

      - name: Run Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
        run: |
          timeout 25m python3 -u worker.py || true

      - name: Upload Application Database
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-data
          path: |
            data/applications.db
            screenshots/
