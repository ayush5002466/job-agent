name: Run Job Agent

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: 

jobs:
  run-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy google-genai pyyaml playwright
          playwright install chromium
          playwright install-deps

      - name: Run Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          timeout 25m python3 worker.py || true