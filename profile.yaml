name: Run Job Agent

on:
  schedule:
    # Every 30 minutes. GitHub may delay schedule runs under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you click "Run workflow" manually

# Required so the job can push the updated DB back to main
permissions:
  contents: write

# Prevent two runs from fighting over the DB
concurrency:
  group: job-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed for reliable rebase/push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4 pyyaml groq
          fi

      # Only needed if submit_universal.py uses Playwright.
      # Remove this step if you don't use Playwright — it adds ~1 min.
      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Adjust these names to match what submit_universal.py reads
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python worker.py

      - name: Commit updated database
        run: |
          set -e
          git add -f data/applications.db
          if git diff --cached --quiet; then
            echo "No DB changes to commit."
            exit 0
          fi
          git commit -m "chore: update applications DB [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main

      - name: Upload DB as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applications-db
          path: data/applications.db
          if-no-files-found: ignore
